<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <link rel="stylesheet" href="styles.css">
    <title>Tela de Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <form>
            <h1>Projeto Login</h1>
            
            <div class="input-box">
                <input placeholder="Seu Email" type="email">
                <i class="bx bxs-user"></i>
            </div>
            
            <div class="input-box">
                <input type="password" id="senhaInput" placeholder="Senha">
                <i class="bx bxs-lock-alt" id="iconeSenha" onclick="toggleSenha()" data-tooltip="Mostrar senha" style="cursor: pointer;"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="remember">
                    Lembrar a senha
                </label>
                <a href="#">Esqueci a senha </a>
            </div>

            <button type="submit" class="login">Entrar</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </form>
    </main>

    <script>
      function toggleSenha() {
        const inputSenha = document.getElementById('senhaInput');
        const iconeCadeado = document.getElementById('iconeSenha');

        if (inputSenha.type === 'password') {
          inputSenha.type = 'text';
          iconeCadeado.classList.remove('bxs-lock-alt');
          iconeCadeado.classList.add('bxs-lock-open-alt');
          iconeCadeado.setAttribute('data-tooltip', 'Ocultar senha');
        } else {
          inputSenha.type = 'password';
          iconeCadeado.classList.remove('bxs-lock-open-alt');
          iconeCadeado.classList.add('bxs-lock-alt');
          iconeCadeado.setAttribute('data-tooltip', 'Mostrar senha');
        }
      }
    </script>
</body>
</html>
